name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the app bundle
        required: false
        default: 0.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.architecture }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "value=${version:-0.1.0}" >> "${GITHUB_OUTPUT}"

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Configure signing and notarization
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_BASE64 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD secret}"
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APPLE_APP_PASSWORD:?Missing APPLE_APP_PASSWORD secret}"

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/ipa-analyzer-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          sign_identity="$(security find-identity -v -p codesigning "${keychain_path}" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "${sign_identity}" ]]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "ipa-analyzer-ci-notary" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --keychain "${keychain_path}"

          echo "SIGN_IDENTITY=${sign_identity}" >> "${GITHUB_ENV}"
          echo "NOTARY_PROFILE=ipa-analyzer-ci-notary" >> "${GITHUB_ENV}"
          echo "SIGNING_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize DMG
        env:
          ARCHITECTURES: ${{ matrix.architecture }}
          IPA_ANALYZER_VERSION: ${{ steps.version.outputs.value }}
        run: ./package_release_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Analyzer-${{ matrix.architecture }}
          path: dist/release/IPA-Analyzer-*-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}"
          fi

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: IPA-Analyzer-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/SHA256SUMS.txt
          generate_release_notes: true
